<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3021b8">
<title>Pixel Blob V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9cff28;font-family:monospace}
body{display:grid;place-items:center;touch-action:none}
#game{position:relative;width:min(96vw,1500px);height:min(92vh,850px);height:min(92dvh,850px);overflow:hidden;border:4px solid #242020;border-radius:14px;background:#3021b8;box-shadow:0 0 0 5px #9cff28}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#title{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;color:#fff;font-weight:900;letter-spacing:2px;text-shadow:3px 3px #1b146d;pointer-events:none}
#freeze{position:absolute;right:14px;top:max(12px,env(safe-area-inset-top));padding:8px 11px;border:2px solid rgba(255,255,255,.35);border-radius:8px;background:rgba(20,12,90,.7);color:#fff;font:bold 13px monospace}
#hint{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 10px;border:2px solid rgba(255,255,255,.2);border-radius:6px;background:rgba(20,12,90,.72);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none}
@media(max-width:600px){#game{width:100vw;height:100dvh;border-width:3px;border-radius:0;box-shadow:none}#title{font-size:12px;letter-spacing:1px}#hint{font-size:10px}#freeze{font-size:12px;padding:7px 9px}}
</style>
</head>
<body>
<div id="game"><canvas id="canvas"></canvas><div id="title">PIXEL BLOB // V2</div><button id="freeze">❚❚ FREEZE</button><div id="hint">DRAG / MOVE • TAP / CLICK = CHAOS</div></div>
<script>
const c=document.getElementById("canvas"),x=c.getContext("2d");x.imageSmoothingEnabled=false;
let W=1000,H=600,D=1,frozen=false,shake=0,last=performance.now(),particles=[];
const m={x:500,y:300,active:false};
const big={x:500,y:300,vx:0,vy:0,s:34},bs=[];
function resize(){const r=c.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=Math.floor(r.width);H=Math.floor(r.height);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);if(!m.active){m.x=W/2;m.y=H/2}}addEventListener("resize",resize);resize();
function px(a,b,w,h,col){x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),Math.round(w),Math.round(h))}
function blob(a,b,s,col){let u=s/10;px(a-4*u,b-3*u,8*u,6*u,"#393337");px(a-3*u,b-4*u,6*u,8*u,"#393337");px(a-3*u,b-3*u,6*u,6*u,col);px(a-4*u,b-2*u,u,2*u,"#393337");px(a+3*u,b-2*u,u,2*u,"#393337");px(a-3*u,b+3*u,2*u,u,"#393337");px(a+u,b+3*u,2*u,u,"#393337");px(a-1.8*u,b-.8*u,.8*u,.9*u,"#30252f");px(a+u,b-.8*u,.8*u,.9*u,"#30252f");px(a-1.5*u,b+1.1*u,3*u,.55*u,"#30252f");px(a-2.2*u,b-2.5*u,1.4*u,.8*u,"rgba(255,255,255,.3)")}
function init(){big.x=W*.52;big.y=H*.52;bs.length=0;[[.25,.43],[.36,.67],[.74,.58],[.82,.35],[.52,.8],[.12,.58]].forEach((p,i)=>bs.push({x:W*p[0],y:H*p[1],vx:0,vy:0,s:13+i%3*2,phase:Math.random()*6.28,col:["#7540c9","#8b4bd0","#6938bb","#914fd4","#7040c6"][i%5]}))}init();
function point(X,Y){let r=c.getBoundingClientRect();m.x=Math.max(0,Math.min(W,X-r.left));m.y=Math.max(0,Math.min(H,Y-r.top));m.active=true}
function burst(a,b){shake=12;for(let i=0;i<55;i++){let q=Math.random()*6.28,s=2+Math.random()*8;particles.push({x:a,y:b,vx:Math.cos(q)*s,vy:Math.sin(q)*s,life:30+Math.random()*35,size:3+Math.random()*7,col:Math.random()>.5?"#b75ee0":"#7340c9"})}for(const z of bs){let dx=z.x-a,dy=z.y-b,d=Math.max(20,Math.hypot(dx,dy));z.vx+=dx/d*9;z.vy+=dy/d*9}let dx=big.x-a,dy=big.y-b,d=Math.max(40,Math.hypot(dx,dy));big.vx+=dx/d*6;big.vy+=dy/d*6}
let drag=false;
c.addEventListener("pointerdown",e=>{drag=true;c.setPointerCapture?.(e.pointerId);point(e.clientX,e.clientY);burst(m.x,m.y)});
c.addEventListener("pointermove",e=>{if(drag||e.pointerType==="mouse")point(e.clientX,e.clientY)});
c.addEventListener("pointerup",()=>drag=false);c.addEventListener("pointercancel",()=>drag=false);c.addEventListener("pointerleave",()=>{if(!drag)m.active=false});
function toggle(){frozen=!frozen;document.getElementById("freeze").textContent=frozen?"▶ PLAY":"❚❚ FREEZE"}document.getElementById("freeze").onclick=toggle;
addEventListener("keydown",e=>{if(e.code==="Space"){toggle();e.preventDefault()}});
function update(dt){if(frozen)return;let k=Math.min(dt/16.67,2);let tx=m.active?m.x:W*.52,ty=m.active?m.y:H*.52;big.vx+=(tx-big.x)*.006*k;big.vy+=(ty-big.y)*.006*k;big.vx*=Math.pow(.91,k);big.vy*=Math.pow(.91,k);big.x+=big.vx*k;big.y+=big.vy*k;
bs.forEach((z,i)=>{let a=z.phase+performance.now()*.0005,r=105+i*18;z.vx+=(big.x+Math.cos(a)*r-z.x)*.0018*k;z.vy+=(big.y+Math.sin(a)*r-z.y)*.0018*k;z.vx*=Math.pow(.94,k);z.vy*=Math.pow(.94,k);z.x+=z.vx*k;z.y+=z.vy*k});particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx*k;p.y+=p.vy*k;p.vx*=Math.pow(.97,k);p.vy*=Math.pow(.97,k);p.life-=k});shake*=Math.pow(.82,k)}
function draw(){x.clearRect(0,0,W,H);x.save();if(shake>.2)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);x.fillStyle="#3021b8";x.fillRect(0,0,W,H);for(let i=0;i<40;i++)px(i*137%W,i*83%H,3,3,"rgba(255,255,255,.055)");particles.forEach(p=>px(p.x,p.y,p.size,p.size,p.col));bs.forEach(z=>blob(z.x,z.y+Math.sin(performance.now()*.002+z.phase)*3,z.s,z.col));blob(big.x,big.y,big.s*(1+Math.sin(performance.now()*.0025)*.025),"#b35cdd");if(m.active){x.strokeStyle="rgba(255,255,255,.2)";x.lineWidth=2;x.strokeRect(m.x-10,m.y-10,20,20)}x.restore();if(frozen){x.fillStyle="rgba(0,0,0,.35)";x.fillRect(0,0,W,H);x.fillStyle="#fff";x.font="bold 20px monospace";x.textAlign="center";x.fillText("❚❚ FROZEN",W/2,H/2)}}
function loop(t){let dt=Math.min(40,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
